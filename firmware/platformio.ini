; ESP32 Party Games firmware: plain ESP-IDF (no Arduino) so sdkconfig limits
; (DHCP leases, sockets) can be raised; see sdkconfig.defaults.

[platformio]
default_envs = esp32-s3

[env:esp32-s3]
platform = espressif32@6.13.0
framework = espidf
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.partitions = partitions.csv
; PlatformIO generates the assembly for ESP-IDF EMBED_FILES itself, so the
; list must match src/CMakeLists.txt.
board_build.embed_files =
    ../web/dist/index.html.gz
    ../web/dist/portal.html.gz
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:tools/build_web.py

; Game logic on the PC (needs a host g++): `pio test -e native` runs the unit
; tests and the bot simulator in test/.
[env:native]
platform = native
build_src_filter = +<core/> +<games/>
build_flags = -std=gnu++17 -Isrc -Wall -Wextra -O2
test_build_src = yes

; Host simulator: the same core/ and games/ behind stdin/stdout, bridged to
; WebSockets by web/scripts/sim.mjs for UI work without a board.
[env:host]
platform = native
build_src_filter = +<core/> +<games/> +<host/>
build_flags = -std=gnu++17 -Isrc -Wall -Wextra -O2 -pthread -static-libstdc++ -static-libgcc
