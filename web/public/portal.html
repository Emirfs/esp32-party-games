<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oyun Kutusu</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #14121a;
        color: #f2eff8;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 22rem;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
      }
      p {
        color: #9c95ad;
      }
      button {
        font: inherit;
        font-weight: 700;
        font-size: 1.25rem;
        width: 100%;
        padding: 1rem;
        border: 0;
        border-radius: 0.75rem;
        background: #a78bfa;
        color: #14121a;
      }
      code {
        color: #f2eff8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Oyun Kutusu</h1>
      <p>Kutunun ağına bağlandın. İnternet yok; oyunlar bu ağın içinde oynanır.</p>
      <button id="go">Oyuna gir</button>
      <p>Bu pencere kapanırsa tarayıcıda <code>http://192.168.4.1</code> adresini aç.</p>
    </main>
    <script>
      // Accepting tells the box to answer this phone's connectivity checks as
      // "online", so the OS keeps the Wi-Fi instead of fleeing to mobile data.
      document.getElementById('go').addEventListener('click', function () {
        fetch('/api/accept', { method: 'POST' })
          .catch(function () {})
          .then(function () {
            location.href = 'http://192.168.4.1/';
          });
      });
    </script>
  </body>
</html>
