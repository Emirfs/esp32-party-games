<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Party Games</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #14121a;
        color: #f2eff8;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 22rem;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
      }
      p {
        color: #9c95ad;
      }
      button {
        font: inherit;
        font-weight: 700;
        border: 0;
        border-radius: 0.75rem;
        cursor: pointer;
      }
      #go {
        font-size: 1.25rem;
        width: 100%;
        padding: 1rem;
        background: #a78bfa;
        color: #14121a;
      }
      .lang {
        display: flex;
        justify-content: center;
        gap: 0.25rem;
        margin-bottom: 1rem;
      }
      .lang button {
        padding: 0.375rem 0.625rem;
        background: #1f1c28;
        color: #9c95ad;
      }
      .lang button[aria-pressed='true'] {
        background: #a78bfa;
        color: #14121a;
      }
      code {
        color: #f2eff8;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="en">EN</button>
        <button data-lang="tr">TR</button>
      </div>
      <h1>Party Games</h1>
      <p data-t="joined"></p>
      <button id="go" data-t="play"></button>
      <p data-t="closed"></p>
    </main>
    <script>
      // Same language rule and storage key as the app (web/src/i18n.ts).
      var STRINGS = {
        en: {
          joined: 'You joined the box network. There is no internet; games run inside this network.',
          play: 'Play',
          closed: 'If this window closes, open <code>http://192.168.4.1</code> in your browser.',
        },
        tr: {
          joined: 'Kutunun ağına bağlandın. İnternet yok; oyunlar bu ağın içinde oynanır.',
          play: 'Oyuna gir',
          closed: 'Bu pencere kapanırsa tarayıcıda <code>http://192.168.4.1</code> adresini aç.',
        },
      };
      var saved = null;
      try {
        saved = localStorage.getItem('pg.lang');
      } catch (e) {}
      var lang = saved === 'en' || saved === 'tr' ? saved : navigator.language.toLowerCase().indexOf('tr') === 0 ? 'tr' : 'en';

      function render() {
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-t]').forEach(function (el) {
          el.innerHTML = STRINGS[lang][el.getAttribute('data-t')];
        });
        document.querySelectorAll('[data-lang]').forEach(function (el) {
          el.setAttribute('aria-pressed', String(el.getAttribute('data-lang') === lang));
        });
      }

      document.querySelectorAll('[data-lang]').forEach(function (el) {
        el.addEventListener('click', function () {
          lang = el.getAttribute('data-lang');
          try {
            localStorage.setItem('pg.lang', lang);
          } catch (e) {}
          render();
        });
      });

      // Accepting tells the box to answer this phone's connectivity checks as
      // "online", so the OS keeps the Wi-Fi instead of fleeing to mobile data.
      document.getElementById('go').addEventListener('click', function () {
        fetch('/api/accept', { method: 'POST' })
          .catch(function () {})
          .then(function () {
            location.href = 'http://192.168.4.1/';
          });
      });

      render();
    </script>
  </body>
</html>
